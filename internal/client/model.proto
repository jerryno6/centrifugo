syntax = "proto3";

package wsmessage;

option go_package = "./pb";

// Score represents a score submission from client
message Score {
  string game_id = 1;
  string user_id = 2;
  int64 score = 3;
  int64 total_score = 4;
  int64 timestamp = 5;
}

// WSMessage wraps different message types
message WSMessage {
  string type = 1;
  Score data = 2;
}
